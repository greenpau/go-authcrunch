openapi: 3.1.1
info:
  title: AuthCrunch HTTP API
  version: 1.3.11
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |-
    HTTP contracts implemented by AuthCrunch authentication portals and authorization policies. The API reference version follows the repository VERSION and is synchronized during releases.

    Set origin and portalBasePath to your deployment. Every documented path inherits this common prefix, including /oauth2 paths. With portalBasePath /auth, Direct OAuth uses /auth/oauth2/authorization-code-callback and /auth/oauth2/logout; portal federation uses /auth/oauth2/{realm} and its callback routes. Direct OAuth requires the policy's full oauth base path to match this layout and its exact callback/logout paths to be delegated to the policy before catch-all portal routes. Feature flags, enabled realms, signing algorithms and application registrations determine endpoint availability. Examples use reserved domains and nonfunctional credentials.

    Portal access tokens, stored browser sessions, portal refresh credentials, OIDC tokens and direct OAuth sessions are separate credential boundaries. Retain browser cookies and CSRF state; do not substitute one credential for another. API JSON clients request Accept: application/json. Browser routes use text/html; many browser errors render HTML or redirects.

    Configuration and host-server management APIs are outside this specification. Authorization policies apply to deployment-defined application paths; there is no fixed /authorize REST endpoint. Static UI assets, diagnostic image URLs, recovery placeholders and provider-specific UI pages are not versioned JSON APIs. Persistent-state failure or server shutdown can return an additional 503 text response before an endpoint handler runs.
servers:
- url: '{origin}{portalBasePath}'
  description: Configured authentication portal. Adjust deployment variables before making requests. Browser
    same-origin APIs must run from the actual portal origin; this documentation server does not proxy
    requests or bypass CORS.
  variables:
    origin:
      default: https://auth.myfiosgateway.com:8443
      description: Public HTTPS origin without a trailing slash.
    portalBasePath:
      default: /auth
      description: >-
        Actual portal mount without a trailing slash; empty for a root-mounted portal.
        Use a neutral mount such as /auth, /xauth or /tenant/auth. Do not use reserved
        route namespaces such as saml or oauth2 as mount segments, including inside
        nested mounts. Legacy endpoint prefixes such as login-service and profile-ui
        are also reserved. The standalone host rejects reserved mounts at startup;
        other embedding hosts own their mount validation.
tags:
- name: Registration
  description: Browser registration submission and acknowledgement.
- name: Authentication Portal
  description: JSON/API-key and Basic login, browser navigation, identity probes, and optional portal
    session refresh and logout.
- name: External Authentication
  description: External OAuth/OIDC and SAML login, portal SSO metadata, and policy-owned Direct OAuth
    callback/logout. Direct OAuth uses {portalBasePath}/oauth2 with matching policy configuration and
    exact policy routes.
- name: Cross-Device Sign-In
  description: Optional explicit browser-to-browser sign-in approval and transfer.
- name: Profile
  description: User-owned local profile, credential and authentication-policy operations.
- name: Documents
  description: |
    Client-encrypted storage and sharing use separate resource paths beneath `/api/documents/`,
    relative to the configured portal mount. GET reads resources, PUT installs immutable
    keys, manifests, chunks and grants, and DELETE removes documents or grants. POST
    allocates uploads, commits them or resets a vault. Resource IDs are path parameters;
    only file listing accepts an optional `after` query cursor. `/api/documents` itself is not an endpoint.

    Documents is **disabled by default**. Enable it explicitly with `enable documents api`
    and valid storage/origin/realm settings. Configure the exact serialized HTTPS origin:
    lowercase ASCII/punycode host or canonical IP, no path/query/fragment, no default
    `:443`, and no empty or zero-padded port. Invalid enabled settings fail before
    creating storage. Requests need a valid portal access token
    and current stored browser login evidence for an allowed local user. Ownership
    and grants use the exact local database user `id`; administrators have no override.

    ## Message format

    GET, DELETE and upload commit use no request body. For example, download chunk zero
    with `GET /api/documents/file/{id}/chunk/0/fetch`; delete an owned file with
    `DELETE /api/documents/file/{id}/delete`. Other writes send the documented fields
    directly as JSON with `Content-Type: application/json`. There are no request
    `operation` or `payload` wrapper fields, and path parameters must not be repeated in bodies. Every success is HTTP 200 with the documented resource fields directly in the
    response body. There is no `operation` or `result` response wrapper. Mutations
    without resource data return `{ "success": true }`, with an explicit boolean schema.
    Unknown fields (including old wrappers), duplicates, null required values and
    noncanonical member names are rejected.

    User IDs are lowercase non-nil UUIDs. Portal/file IDs and key fingerprints are
    32 bytes encoded as 43-character unpadded base64url. All ciphertext and public-key
    fields also use canonical unpadded base64url. Binary content is encrypted before
    transmission. The message limit is 65536 bytes, except `chunk.put` permits 1463659
    bytes for the entire JSON request body. Decoded chunks are at most 1048592 bytes.

    Only clients and chosen recipients hold decryption keys. Never transmit recovery
    secrets, private keys or unwrapped document keys. A URL-only observer can see the operation and resource identifiers, including pagination cursors.
    A decrypted-TLS observer can also see identifiers, sizes and sharing relationships. File contents and filenames remain encrypted.

    ## Client workflows

    - **Enroll/unlock:** `bootstrap` → `key.fetch`; if absent, generate a keypair and save
      the recovery secret locally, then `key.register`. Existing vaults unlock locally.
    - **Upload:** `file.allocate` → encrypt using its immutable descriptor →
      `file.manifest` → `chunk.put` for every index → `file.commit`.
    - **Download:** `file.list` → `file.fetch` → unwrap locally → `chunk.fetch` for every
      index → authenticate all chunks before completing the download.
    - **Share:** `key.lookup` → verify the recipient fingerprint → wrap the document
      key locally → `share.put`. Inspect grants with `share.list`; revoke with `share.delete`.
    - **Remove:** `file.delete` removes one owned document. `key.reset` is a separately
      confirmed destructive reset of the entire vault and all owned documents.

    ## Operation and message catalogue

    Each operation below has its own method/path, documented parameters or JSON body,
    expected responses and **Test Request** console. Examples use synthetic identifiers and ciphertext: replace them with
    current account/upload data before sending. Selecting an operation sends nothing.
    Browser calls must originate at the configured portal origin; when the reference
    is hosted elsewhere, use the generated command with current session credentials.

    | Operation | Method | Path |
    | --- | --- | --- |
    | [Discover identity and limits](#tag/documents/GET/api/documents/bootstrap) | `GET` | `/api/documents/bootstrap` |
    | [Read your encrypted recovery vault](#tag/documents/GET/api/documents/keys/fetch) | `GET` | `/api/documents/keys/fetch` |
    | [Enroll a public key and encrypted vault](#tag/documents/PUT/api/documents/keys/register) | `PUT` | `/api/documents/keys/register` |
    | [Reserve an encrypted upload](#tag/documents/POST/api/documents/files/allocate) | `POST` | `/api/documents/files/allocate` |
    | [Store encrypted metadata and the owner envelope](#tag/documents/PUT/api/documents/file/{id}/manifest) | `PUT` | `/api/documents/file/{id}/manifest` |
    | [Upload one encrypted chunk](#tag/documents/PUT/api/documents/file/{id}/chunk/{idx}/put) | `PUT` | `/api/documents/file/{id}/chunk/{idx}/put` |
    | [Publish a complete upload](#tag/documents/POST/api/documents/file/{id}/commit) | `POST` | `/api/documents/file/{id}/commit` |
    | [List owned and received documents](#tag/documents/GET/api/documents/files) | `GET` | `/api/documents/files` |
    | [Read a document descriptor and your envelope](#tag/documents/GET/api/documents/file/{id}/fetch) | `GET` | `/api/documents/file/{id}/fetch` |
    | [Download one encrypted chunk](#tag/documents/GET/api/documents/file/{id}/chunk/{idx}/fetch) | `GET` | `/api/documents/file/{id}/chunk/{idx}/fetch` |
    | [Find a recipient public key](#tag/documents/GET/api/documents/key/{user_id}/lookup) | `GET` | `/api/documents/key/{user_id}/lookup` |
    | [Grant a recipient read access](#tag/documents/PUT/api/documents/file/{id}/share/{user_id}/put) | `PUT` | `/api/documents/file/{id}/share/{user_id}/put` |
    | [List a file's recipients](#tag/documents/GET/api/documents/file/{id}/share/list) | `GET` | `/api/documents/file/{id}/share/list` |
    | [Revoke a recipient grant](#tag/documents/DELETE/api/documents/file/{id}/share/{user_id}/delete) | `DELETE` | `/api/documents/file/{id}/share/{user_id}/delete` |
    | [Delete an owned document](#tag/documents/DELETE/api/documents/file/{id}/delete) | `DELETE` | `/api/documents/file/{id}/delete` |
    | [Confirm a destructive vault reset](#tag/documents/POST/api/documents/keys/reset) | `POST` | `/api/documents/keys/reset` |

    ## Error messages and uncertain outcomes

    Errors use the HTTP status and a generic `{ "status": number, "message": "reason" }`
    body, as the direct error response. For example, HTTP 409 is:

    ```json
    {"status":409,"message":"Conflict"}
    ```

    | HTTP status | Meaning |
    | --- | --- |
    | 400 | Invalid message, fields, identifiers, query or chunk shape. |
    | 401 | Missing, expired, revoked or unsupported stored login evidence. |
    | 403 | Origin, role, realm or immutable identity-source boundary rejected. |
    | 404 | Disabled API, unknown route, unenrolled key, expired upload or inaccessible resource. |
    | 405 | Unsupported method; `Allow` names the method required by this endpoint. |
    | 409 | Immutable data differs, required upload data is missing, recipient key changed or reset confirmation is stale. |
    | 413 | JSON body or chunk ciphertext exceeds its size limit; invalid key/vault/envelope/metadata lengths return 400. |
    | 415 | A JSON write lacks application/json Content-Type, or Content-Encoding is present. |
    | 507 | Configured byte/file/recipient/key/identity-reservation quota exceeded. |
    | 503 | Storage is unavailable; a write outcome may be uncertain. |

    Authentication/origin/body checks apply to every operation. The operation sections
    identify additional state-dependent errors. Missing and unauthorized file reads
    deliberately share 404. Responses are no-store; never log secrets or plaintext.
    On lost responses or 503, reconcile with read messages before retrying a write.
    Keep exact encrypted bytes for retries; never reencrypt a chunk under the same
    document context. Allocation may create a second file if repeated, and reset
    confirmation must remain bound to the originally confirmed user and fingerprint.
- name: Discovery
  description: Public signing-key discovery for portal access tokens.
- name: OpenID Connect
  description: Optional portal OpenID Provider with Authorization Code and rotating refresh grants.
- name: Administration
  description: Explicitly enabled administrative realm/user APIs and private export.
- name: System
  description: Encrypted AuthCrunch machine-to-machine authentication transport.
