components:
  securitySchemes:
    PortalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal access token. User transforms and configured policy decide roles. This is not
        an OIDC access token.
    PortalCookie:
      type: apiKey
      in: cookie
      name: AUTHP_ACCESS_TOKEN
      description: Default portal access-token cookie. Cookie name/prefix is configurable; use the deployment
        name. Profile endpoints additionally require stored local session evidence.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: AUTHP_REFRESH_TOKEN
      description: Default portal refresh cookie; deployment prefix/name may differ. Browser POST also
        requires Origin and X-Authcrunch-Refresh.
    BasicLogin:
      type: http
      scheme: basic
      description: Identity-store username/password for the direct Basic login route. Standard-Base64
        encode the raw username:password pair; do not form-percent-encode it as for OAuth client Basic.
        The first colon separates the username from the password, with no trimming.
    OIDCClientBasic:
      type: http
      scheme: basic
      description: Registered OAuth client ID and client secret; form-percent-encode each separately,
        join with a colon, then standard-Base64 encode for HTTP Basic. The server form-decodes both values,
        so a literal plus must be encoded as %2B. Use the registered authentication method. Duplicate
        Authorization headers, a body client_secret alongside Basic (even empty), or a mismatching body
        client_id fail. This is distinct from identity-store Basic login.
    OIDCAccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque OIDC access credential from /oidc/token; not a portal JWT or ID token.
    OIDCBrowserSession:
      type: apiKey
      in: cookie
      name: AUTHP_OIDC_SESSION_ID
      description: Server-set OP browser session. Configurable name/prefix. Cannot be replaced with a
        portal access token.
    OIDCPendingRequest:
      type: apiKey
      in: cookie
      name: AUTHP_OIDC_REQUEST_ID
      description: Server-set pending authorization credential. Configurable name/prefix.
    CrossDeviceBinding:
      type: apiKey
      in: cookie
      name: AUTHP_CROSS_DEVICE_SESSION_ID
      description: Approving-browser binding cookie. Configurable name/prefix; form csrf must match.
    SAMLBrowserBinding:
      type: apiKey
      in: cookie
      name: AUTHP_SAML_SESSION_ID_<RelayState>
      description: Transaction-specific host-only SAML browser proof. The wire name is the configured
        base (default AUTHP_SAML_SESSION_ID), an underscore, and the exact canonical 43-character
        RelayState. The angle-bracket suffix here is a placeholder; OpenAPI cannot model dynamic cookie names. Secure, HttpOnly, SameSite=None, Path=/, Max-Age=300; exactly one matching
        cookie must return with the IdP POST. RelayState and the signed response are independently required.
