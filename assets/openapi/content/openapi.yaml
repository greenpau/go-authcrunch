openapi: 3.1.1
info:
  title: AuthCrunch HTTP API
  version: 1.3.11
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |-
    HTTP contracts implemented by AuthCrunch authentication portals and authorization policies. The API reference version follows the repository VERSION and is synchronized during releases.

    Set origin and portalBasePath to your deployment. Every documented path inherits this common prefix, including /oauth2 paths. With portalBasePath /auth, Direct OAuth uses /auth/oauth2/authorization-code-callback and /auth/oauth2/logout; portal federation uses /auth/oauth2/{realm} and its callback routes. Direct OAuth requires the policy's full oauth base path to match this layout and its exact callback/logout paths to be delegated to the policy before catch-all portal routes. Feature flags, enabled realms, signing algorithms and application registrations determine endpoint availability. Examples use reserved domains and nonfunctional credentials.

    Portal access tokens, stored browser sessions, portal refresh credentials, OIDC tokens and direct OAuth sessions are separate credential boundaries. Retain browser cookies and CSRF state; do not substitute one credential for another. API JSON clients request Accept: application/json. Browser routes use text/html; many browser errors render HTML or redirects.

    Configuration and host-server management APIs are outside this specification. Authorization policies apply to deployment-defined application paths; there is no fixed /authorize REST endpoint. Static UI assets, diagnostic image URLs, recovery placeholders and provider-specific UI pages are not versioned JSON APIs. Persistent-state failure or server shutdown can return an additional 503 text response before an endpoint handler runs.
servers:
- url: '{origin}{portalBasePath}'
  description: Configured authentication portal. Adjust deployment variables before making requests. Browser
    same-origin APIs must run from the actual portal origin; this documentation server does not proxy
    requests or bypass CORS.
  variables:
    origin:
      default: https://auth.myfiosgateway.com:8443
      description: Public HTTPS origin without a trailing slash.
    portalBasePath:
      default: /auth
      description: Actual portal mount without a trailing slash; empty for a root-mounted portal.
tags:
- name: Registration
  description: Browser registration submission and acknowledgement.
- name: Authentication Portal
  description: JSON/API-key and Basic login, browser navigation, identity probes, and optional portal
    session refresh and logout.
- name: External Authentication
  description: External OAuth/OIDC and SAML login, portal SSO metadata, and policy-owned Direct OAuth
    callback/logout. Direct OAuth uses {portalBasePath}/oauth2 with matching policy configuration and
    exact policy routes.
- name: Cross-Device Sign-In
  description: Optional explicit browser-to-browser sign-in approval and transfer.
- name: Profile
  description: User-owned local profile, credential and authentication-policy operations.
- name: Discovery
  description: Public signing-key discovery for portal access tokens.
- name: OpenID Connect
  description: Optional portal OpenID Provider with Authorization Code and rotating refresh grants.
- name: Administration
  description: Explicitly enabled administrative realm/user APIs and private export.
- name: System
  description: Encrypted AuthCrunch machine-to-machine authentication transport.
