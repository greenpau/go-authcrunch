x-contract-scope:
  authority: Local AuthCrunch implementation; see reviewed-sources.yaml.
  excluded:
  - Host-server administrative configuration API
  - Static assets, favicon and theme-specific HTML profile pages
  - QR/barcode image helpers and mobile-access presentation
  - Unimplemented password recovery and SSO assume-role branches
  - Provider-specific external HTTP endpoints not hosted by AuthCrunch
  - Arbitrary protected application resources
