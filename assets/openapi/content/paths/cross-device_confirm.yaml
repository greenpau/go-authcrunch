get:
  operationId: crossDeviceConfirmation
  tags:
  - Cross-Device Sign-In
  summary: Review a cross-device sign-in request
  description: 'Requires explicitly enabled cross-device login and HTTPS. This browser-bound transfer
    is not the OAuth Device Authorization Grant. The QR/activation link contains only the code; the requester
    retains its secret. POSTs require the exact same-origin Origin and form encoding, at most 4096 bytes,
    without repeated body fields. Fresh login on the approving browser and a separate approve decision
    are required. All responses are no-store.


    Requires fresh completed login bound to this transfer; shows account and display code.'
  security:
  - CrossDeviceBinding: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '403':
      description: HTTPS origin, browser fetch context, or required approving-browser binding/CSRF check
        failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '404':
      $ref: ../components/responses/PlainError.yaml
    '405':
      description: Method not supported at this exact endpoint; see Allow.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
        Allow:
          schema:
            type: string
            const: GET, POST
          description: Methods accepted at this endpoint.
    '410':
      description: Unknown, expired, denied, cancelled or already-consumed transfer, incorrect requester
        secret, or missing/stale approval evidence.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '500':
      description: HTML template rendering failed; text/plain is the fallback if the error template also
        fails.
      content:
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '503':
      description: Session storage or issuance is temporarily unavailable. A consumed approval cannot
        be retried to mint credentials.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
  x-source-files:
  - pkg/authn/cross_device_http.go
post:
  operationId: crossDeviceDecision
  tags:
  - Cross-Device Sign-In
  summary: Approve or deny cross-device sign-in
  description: 'Requires explicitly enabled cross-device login and HTTPS. This browser-bound transfer
    is not the OAuth Device Authorization Grant. The QR/activation link contains only the code; the requester
    retains its secret. POSTs require the exact same-origin Origin and form encoding, at most 4096 bytes,
    without repeated body fields. Fresh login on the approving browser and a separate approve decision
    are required. All responses are no-store.


    A separate explicit decision is required after fresh login. Clears the binding cookie after a decision.
    Content-Type parameters such as charset=utf-8 are accepted. Form fields are read from the body, without
    trimming; query fields cannot supply code, secret or csrf. Repeated body fields fail, including unrecognized
    fields.'
  security:
  - CrossDeviceBinding: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '400':
      description: Malformed form encoding, missing/malformed Content-Type, or repeated body fields.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '403':
      description: HTTPS origin, browser fetch context, or required approving-browser binding/CSRF check
        failed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '404':
      $ref: ../components/responses/PlainError.yaml
    '405':
      description: Method not supported at this exact endpoint; see Allow.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
        Allow:
          schema:
            type: string
            const: GET, POST
          description: Methods accepted at this endpoint.
    '410':
      description: Unknown, expired, denied, cancelled or already-consumed transfer, incorrect requester
        secret, or missing/stale approval evidence.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '413':
      description: URL-encoded form body exceeds 4096 bytes.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '415':
      description: Content-Type is not application/x-www-form-urlencoded.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '500':
      description: HTML template rendering failed; text/plain is the fallback if the error template also
        fails.
      content:
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '503':
      description: Session storage or issuance is temporarily unavailable. A consumed approval cannot
        be retried to mint credentials.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrossDeviceUnavailable.yaml
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
  x-source-files:
  - pkg/authn/cross_device_http.go
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
          - csrf
          - decision
          properties:
            csrf:
              type: string
              writeOnly: true
              description: Exact approving-browser binding credential from the rendered form and its cookie;
                keep the cookie jar.
              minLength: 26
              maxLength: 26
              pattern: ^[A-Z2-7]{26}$
            decision:
              type: string
              enum:
              - approve
              - deny
              description: Explicit user choice after fresh authentication; opening the activation link
                is insufficient.
    x-maxBytes: 4096
  parameters:
  - name: Origin
    in: header
    description: Exact HTTPS portal origin.
    required: true
    schema:
      type: string
      description: Exact HTTPS portal origin. Compare scheme, host and port exactly; a path or trailing
        slash is not part of an origin.
