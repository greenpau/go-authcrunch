get:
  operationId: externalSAMLLogin
  tags:
  - External Authentication
  summary: Start upstream SAML login
  description: Initiate login with a configured external SAML identity provider. The authentication request
    and browser binding are generated by the provider. Keep browser HTML negotiation; provider configuration
    controls availability. Each initiation creates a distinct host-only, Secure, HttpOnly, SameSite=None cookie
    with Path=/ and a 300-second lifetime. It creates an AuthnRequest and a separate unpredictable RelayState,
    both bound to the exact configured ACS URL and this login's validated destination. Cookie names append an underscore and the canonical RelayState to the configured SAML cookie base. An initiation already carrying 16 transaction cookies receives 429; concurrent requests can arrive before their cookies are visible, so this is not an atomic browser quota. Provider state capacity is bounded separately. Completing one transaction does not replace or delete another transaction's proof. Unsolicited IdP-initiated responses are not accepted;
    configured metadata and a pinned signing certificate establish trust.
    Verified external authentication resolves or automatically provisions an identity in its
    attached local store before portal issuance. Without an explicit attachment the provider
    uses a private in-memory local store. The signed id claim is the local immutable ID;
    provider sub remains available for existing policies. Current local roles and factor rules
    apply; an external login alone cannot satisfy required local MFA. Use /connected-accounts
    to explicitly connect to an existing local account. Provider email never selects an account.
    A nonempty non-transient NameID is required; configure a persistent NameID.
    Its format and qualifiers are included in the external identity key.
  security: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '302':
      $ref: ../components/responses/Redirect.yaml
    '303':
      $ref: ../components/responses/Redirect.yaml
    '400':
      $ref: ../components/responses/HTML.yaml
    '401':
      $ref: ../components/responses/HTML.yaml
    '429':
      $ref: ../components/responses/HTML.yaml
    '500':
      $ref: ../components/responses/HTML.yaml
    '502':
      $ref: ../components/responses/HTML.yaml
    '403':
      $ref: ../components/responses/HTML.yaml
    '501':
      $ref: ../components/responses/HTML.yaml
  x-source-files:
  - pkg/authn/handle_external_login.go
  - pkg/idp/saml/authenticate.go
  - pkg/idp/saml/state.go
  - pkg/idp/saml/provider.go
  - pkg/authn/inject_saml_session_id.go
  - pkg/authn/cookie/saml_transaction.go
  parameters:
  - $ref: ../components/parameters/LoginReturnURL.yaml
  - name: realm
    in: path
    description: Configured enabled realm.
    required: true
    schema:
      type: string
      minLength: 1
post:
  operationId: externalSAMLCallback
  tags:
  - External Authentication
  summary: Process the upstream SAML response
  description: Receive the signed SAML response from the external IdP at the configured assertion consumer
    URL. Binding cookie, signature, request correlation and IdP trust are validated by the provider. This
    is not the portal-provided SSO app metadata route. Keep browser HTML negotiation; provider configuration
    controls availability. Requires Content-Length between 500 and 30000 bytes inclusive and exactly application/x-www-form-urlencoded
    with no charset parameter; unknown/chunked length fails. Both SAMLResponse and RelayState must occur
    exactly once in the body. Admission, missing/duplicate proof, expired/replayed state or invalid signatures
    return HTML 401. Browser/callback mismatches do not consume another browser's state, but an admitted
    response consumes it before XML validation. Success deletes only the matching transaction cookie, releases its bound destination and continues
    portal authorization; authorization policy can still deny login. Azure additionally requires Origin
    to contain login.microsoftonline.com or Referer to contain windowsazure.com (case-sensitive substring
    checks). These driver-specific hints never replace signature validation; the generic driver does not
    require them. Callback query destinations and shared redirect cookies cannot replace the bound destination; empty or rejected destinations select the portal.
    If the verified attached account requires interactive local factors, the portal creates an independent
    browser sandbox retaining that destination. Admission returns HTML 429 when 16 canonical sandbox proof
    cookies are already visible, or HTML 503 when the shared portal sandbox cache is full, without evicting
    existing live sandboxes. The signed transaction has already been consumed; restart SAML login after
    this refusal instead of replaying its response.
  security:
  - SAMLBrowserBinding: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '302':
      $ref: ../components/responses/Redirect.yaml
    '303':
      $ref: ../components/responses/Redirect.yaml
    '400':
      $ref: ../components/responses/HTML.yaml
    '401':
      $ref: ../components/responses/HTML.yaml
      description: Provider authentication failed, including form admission, missing/duplicate fields,
        browser binding, expiry/replay or signature/claim validation.
    '429':
      $ref: ../components/responses/HTML.yaml
    '500':
      $ref: ../components/responses/HTML.yaml
    '502':
      $ref: ../components/responses/HTML.yaml
    '403':
      $ref: ../components/responses/HTML.yaml
    '501':
      $ref: ../components/responses/HTML.yaml
    '503':
      $ref: ../components/responses/HTML.yaml
  x-source-files:
  - pkg/authn/handle_external_login.go
  - pkg/idp/saml/authenticate.go
  - pkg/idp/saml/state.go
  - pkg/idp/saml/provider.go
  - pkg/authn/inject_saml_session_id.go
  - pkg/authn/cookie/saml_transaction.go
  - pkg/authn/connected_accounts.go
  - pkg/authn/browser_sandbox.go
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/SAMLCallback.yaml
    x-minBytes: 500
    x-maxBytes: 30000
  parameters:
  - name: realm
    in: path
    description: Configured enabled realm.
    required: true
    schema:
      type: string
      minLength: 1
