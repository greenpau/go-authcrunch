post:
  operationId: documentsFileCommit
  tags:
  - Documents
  summary: Publish a complete upload
  description: 'The required `id` selects an owned file. Returns 200 only when metadata, the owner envelope
    and every chunk with the exact allocated size are present; incomplete uploads return 409. Successful commit
    changes state to `ready` and removes the unfinished-upload deadline. Repeated commits succeed. Upload expiry
    is absolute and is not extended by writes; an expired upload returns 404. No recipient can read a partially
    uploaded file.


    Disabled by default; requires explicit APIConfig.DocumentsEnabled plus validated storage settings. Admin/Profile
    flags and storage settings alone do not enable Documents. Require an allowed local identity-store realm,
    portal user/admin role, valid portal access token AND current stored browser login evidence. Ordinary access-only
    JSON login, API-key, LDAP and unmapped OAuth/SAML sessions do not establish this authority. Ownership is
    the exact local database user id. Each operation runs inside transactional current-identity verification;
    transformed subject/email never select an owner, and administrators have no access override. Persistent
    source bindings reject UUID collisions across stores and survive reset/restart. MaxKeys bounds both active
    registrations and permanent admitted identity reservations; renaming an authoritative store/realm requires
    an explicit migration.


    Target the configured HTTPS origin and exact portal mount. Origin, if present, must match exactly; Sec-Fetch-Site
    must be same-origin or none. No CORS. Content-Encoding is rejected. The HTTP method and resource path select
    the operation. Path identifiers must not be repeated or overridden in a JSON body. Unknown, encoded or
    noncanonical paths return 404; malformed resource IDs or chunk numbers return 400. Unsupported methods
    return 405 with Allow: POST. Only file.list accepts the optional after query parameter; duplicate, unknown,
    empty or noncanonical query parameters (including a bare ?) return 400.


    Send no request body, including no empty JSON object. Content-Type is not required. Request parameters
    are in the documented path or query. Any nonempty body returns 400 and cannot change the selected resource.


    Every success is a JSON response message with HTTP 200; failures use the generic status/message object.
    Responses are no-store. Quotas reserve full ciphertext size, not physical disk space. Allocation collects
    expired unfinished uploads; there is no background janitor.'
  security:
  - PortalBearer: []
  - PortalCookie: []
  responses:
    '200':
      description: Explicit confirmation that the requested upload publication succeeded.
      headers:
        Cache-Control:
          $ref: ../components/headers/NoStore.yaml
        X-Content-Type-Options:
          $ref: ../components/headers/NoSniff.yaml
        Referrer-Policy:
          $ref: ../components/headers/OIDCNoReferrer.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DocumentsFileCommitResponse.yaml
          examples:
            file.commit:
              summary: Publish a complete upload
              value:
                success: true
    '400':
      $ref: ../components/responses/DocumentsBadRequest.yaml
    '401':
      $ref: ../components/responses/DocumentsUnauthorized.yaml
    '403':
      $ref: ../components/responses/DocumentsForbidden.yaml
    '404':
      $ref: ../components/responses/DocumentsNotFound.yaml
    '405':
      $ref: ../components/responses/DocumentsMethodNotAllowed.yaml
    '409':
      $ref: ../components/responses/DocumentsConflict.yaml
    '413':
      $ref: ../components/responses/DocumentsTooLarge.yaml
    '415':
      $ref: ../components/responses/DocumentsUnsupportedMediaType.yaml
    '507':
      $ref: ../components/responses/DocumentsQuotaExceeded.yaml
    '503':
      $ref: ../components/responses/DocumentsUnavailable.yaml
  x-source-files:
  - pkg/authn/documents_http.go
  - pkg/authn/documents/store.go
  - pkg/authn/documents/transfer.go
  - pkg/authn/documents/protocol.go
  - pkg/authn/documents/config.go
  parameters:
  - name: id
    in: path
    required: true
    description: Document ID returned by file.allocate. Use the exact immutable ID; this does not select an
      owner or bypass access checks.
    schema:
      $ref: ../components/schemas/DocumentsID.yaml
    examples:
      file.commit:
        summary: Publish a complete upload
        value: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
