get:
  operationId: externalProviderLogin
  tags:
  - External Authentication
  summary: Sign in through an HTTP identity provider
  description: >-
    Optional injected IdentityProvider implementing HTTPLoginProvider. Its protocol,
    query parameters, browser binding, destinations, expiry and replay prevention are
    provider-owned; this is not a local password or MFA endpoint. The same GET route
    handles initiation and provider return. Exactly one realm segment is accepted.
    JSON negotiation does not bypass the protocol route. Only GET is allowed; other
    methods return HTML 405 with Allow GET. Unknown providers and invalid realm paths
    return HTML 400. Provider verification errors return HTML 401 without backend
    details. Nil/ambiguous results, malformed identity, unsafe redirect or binding
    cookie return HTML 502. Redirects must be HTTPS, contain no credentials/control
    bytes and be at most 8192 UTF-8 bytes. A binding cookie must use the provider's
    declared name, exact callback path, Secure, HttpOnly, host-only scope and SameSite
    Lax or Strict. On verified identity, the portal applies transforms/challenge
    policy and issues its ordinary browser credentials with federated evidence and
    origin set to the realm. Required local password/MFA policy can still deny issuance.
    Login page links to this route carry no redirect_url, because a provider may
    reject any query on initiation; a completed login returns through the shared
    redirect cookie, which the login page request records.
    Verified external authentication resolves or automatically provisions an identity in its
    attached local store before portal issuance. Without an explicit attachment the provider
    uses a private in-memory local store. The signed id claim is the local immutable ID;
    provider sub remains available for existing policies. Current local roles and factor rules
    apply; an external login alone cannot satisfy required local MFA. Use /connected-accounts
    to explicitly connect to an existing local account. Provider email never selects an account.
    If verified identity requires interactive local factors, the portal creates an independent browser
    sandbox. Its admission returns HTML 429 when 16 canonical sandbox proof cookies are already visible,
    or HTML 503 when the shared portal sandbox cache is full, without evicting live sandboxes. Provider
    verification may already have consumed its one-use evidence; follow its restart contract rather than
    assuming the same callback can be retried.

    Completed access-only login can replace an old browser refresh family. If that revocation commit
    is uncertain, the portal returns 503 HTML without positive credentials or a success redirect,
    even if the error also denotes invalid old credentials. Protocol binding-cookie tombstones may
    still be sent. This does not enable provider-snapshot refresh for the injected provider.
  security: []
  parameters:
  - name: realm
    in: path
    required: true
    description: Enabled HTTP provider realm; unique and distinct from identity-store realms.
    schema:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_-]{1,64}$
  responses:
    '302':
      $ref: ../components/responses/Redirect.yaml
    '303':
      $ref: ../components/responses/Redirect.yaml
    '400':
      $ref: ../components/responses/HTML.yaml
    '401':
      $ref: ../components/responses/HTML.yaml
    '403':
      $ref: ../components/responses/HTML.yaml
    '405':
      description: Only GET is accepted; HTML error page.
      headers:
        Allow:
          schema:
            type: string
            const: GET
      content:
        text/html:
          schema:
            type: string
    '429':
      $ref: ../components/responses/HTML.yaml
    '500':
      $ref: ../components/responses/HTML.yaml
    '502':
      $ref: ../components/responses/HTML.yaml
    '503':
      $ref: ../components/responses/HTML.yaml
  x-source-files:
  - pkg/authn/handle_provider_login.go
  - plugins/identity-providers/sqlite/provider.go
  - plugins/identity-providers/sqlite/config.go
  - pkg/authn/serve_http.go
  - pkg/authn/handle_http_login.go
  - pkg/idp/http_login.go
  - pkg/authn/portal.go
  - pkg/authn/connected_accounts.go
  - pkg/authn/browser_sandbox.go
