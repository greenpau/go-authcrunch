get:
  operationId: externalOAuthCallback
  tags:
  - External Authentication
  summary: Process the upstream OAuth callback
  description: 'Complete the upstream OAuth/OIDC browser transaction. Exactly one state value must match
    the initiating browser session and callback and be younger than five minutes. A matching callback
    claims state once and removes it on completion, including provider errors; wrong-browser attempts
    do not consume the legitimate transaction. For code flow, send code with state. Presence of error
    takes precedence over code; error_description is only explanatory. The selected portal provider uses
    the first value of non-state query fields, unlike the stricter Direct OAuth policy. It also supports
    the configured fragment-token bridge through id_token plus access_token and state. The iss query hint
    is ignored: issuer trust comes from configured/discovered issuer and cryptographically verified token
    claims. With no state/code/error/access_token parameter, this URL starts a new upstream login. Keep
    browser HTML negotiation. Successful upstream verification still passes portal authorization/transforms
    before issuing a session. A redirect_url on the callback URL never chooses the post-login destination:
    only the one bound when this login started is returned, and only from a successful callback.

    A realm explicitly selected by refresh_tokens.realms plus provider_revalidation with mode snapshot
    receives a short portal access JWT and an opaque portal refresh family. Both arrive only in Secure,
    HttpOnly cookies; Authorization is omitted. The verified subject is pinned before transformations,
    auth_time is the portal callback time, and amr is federated. No upstream access/refresh/ID token is
    stored by this feature. Identity-token cookies must be disabled for selected provider realms.
    Snapshot renewal preserves captured provider attributes and re-runs current portal transforms
    with the current portal request context, including issuer/address-dependent factor requirements;
    recognized provider roles enter policy before signing, which preserves the transformed role set;
    it does not observe upstream disablement, changed roles or provider logout. Access expiry is capped
    by the family absolute deadline. Only an actual refresh extends the idle deadline. Unselected
    providers retain access-only behavior. Fresh login atomically replaces presented browser families,
    including at capacity; an undelivered new family is revoked after completion failure. The exact
    configured HTTPS origin and mount are required. After successful state redemption, cross-site
    document navigation is allowed; Fetch Metadata cannot select another transport.'
  security: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '302':
      $ref: ../components/responses/Redirect.yaml
    '303':
      $ref: ../components/responses/Redirect.yaml
    '400':
      $ref: ../components/responses/HTML.yaml
    '401':
      $ref: ../components/responses/HTML.yaml
    '503':
      $ref: ../components/responses/HTML.yaml
    '500':
      $ref: ../components/responses/HTML.yaml
    '502':
      $ref: ../components/responses/HTML.yaml
    '403':
      $ref: ../components/responses/HTML.yaml
    '501':
      $ref: ../components/responses/HTML.yaml
  x-source-files:
  - pkg/authn/handle_external_login.go
  - pkg/authn/handle_http_login.go
  - pkg/authn/token_refresh_provider.go
  - pkg/authn/token_refresh_config.go
  - pkg/idp/oauth/authenticate.go
  - pkg/idp/oauth/authenticate_setup.go
  - pkg/idp/oauth/state.go
  parameters:
  - name: realm
    in: path
    description: Configured enabled realm.
    required: true
    schema:
      type: string
      minLength: 1
  - name: code
    in: query
    description: Provider authorization code. The first occurrence is used; an error parameter takes precedence.
      Redeemed once using the stored PKCE verifier when enabled.
    required: false
    schema:
      type: string
  - name: state
    in: query
    description: 'Required to complete a callback: exact UUID state issued for this browser transaction.
      Missing, empty, repeated, expired or replayed state fails with HTML 401.'
    required: false
    schema:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
  - name: error
    in: query
    description: Provider error.
    required: false
    schema:
      type: string
  - name: error_description
    in: query
    description: Provider error detail.
    required: false
    schema:
      type: string
  - name: iss
    in: query
    description: Ignored by this portal-provider callback; not independent issuer-validation evidence.
      Direct OAuth has different admission rules.
    required: false
    schema:
      type: string
  - name: id_token
    in: query
    required: false
    description: Provider ID-token JWT used only together with the other token and bound state by the
      configured fragment-token flow. Treat as a credential; the bridge converts URL fragments to query
      fields.
    schema:
      type: string
      writeOnly: true
  - name: access_token
    in: query
    required: false
    description: Provider access credential used only together with the other token and bound state by
      the configured fragment-token flow. Treat as a credential; the bridge converts URL fragments to
      query fields.
    schema:
      type: string
      writeOnly: true
