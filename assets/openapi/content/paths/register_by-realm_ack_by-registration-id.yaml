get:
  operationId: registrationAckGet
  tags:
  - Registration
  summary: Open the registration confirmation form
  description: Browser registration acknowledgement for an existing registration entry. POST checks the
    emailed registration_code and updates registration state. Incorrect/expired confirmation may render
    a page with HTTP 200; do not infer activation from status alone. Pending entries expire after 3600
    seconds by default and are lost on registry replacement/restart. A successful confirmation consumes
    the pending entry and writes only the separate registration dropbox, then attempts an administrator
    notification. It does not create an active account in the login store; replay cannot confirm the consumed
    entry again.
  security: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '302':
      $ref: ../components/responses/Redirect.yaml
    '400':
      $ref: ../components/responses/HTML.yaml
  x-source-files:
  - pkg/authn/handle_register.go
  - pkg/registry/cache.go
  - pkg/registry/local_user_registry.go
  parameters:
  - name: realm
    in: path
    description: Configured enabled realm.
    required: true
    schema:
      type: string
      minLength: 1
  - name: registration_id
    in: path
    description: 'Opaque registration ID generated by the portal: 64–95 ASCII letters/digits. It must
      identify an existing registration in this realm.'
    required: true
    schema:
      type: string
      minLength: 64
      maxLength: 95
      pattern: ^[A-Za-z0-9]{64,95}$
post:
  operationId: registrationAckPost
  tags:
  - Registration
  summary: Verify the registration confirmation code
  description: Browser registration acknowledgement for an existing registration entry. POST checks the
    emailed registration_code and updates registration state. Incorrect/expired confirmation may render
    a page with HTTP 200; do not infer activation from status alone. Pending entries expire after 3600
    seconds by default and are lost on registry replacement/restart. A successful confirmation consumes
    the pending entry and writes only the separate registration dropbox, then attempts an administrator
    notification. It does not create an active account in the login store; replay cannot confirm the consumed
    entry again. The acknowledgement handler uses normal form parsing and does not apply the submission
    handler's 15–1000-byte Content-Length or exact Content-Type checks. An injected registry implementing
    ConfirmationProvider receives the registration ID and code instead of the default local confirmation.
    That capability requires exactly one body registration_code and exactly one value across body/query;
    duplicate or missing values render the registration screen without consuming the entry. Registry
    capability errors are presented as Registration confirmation denied, without backend error details.
    The registry owns persistence, expiry and successful confirmation semantics.
  security: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '302':
      $ref: ../components/responses/Redirect.yaml
    '400':
      $ref: ../components/responses/HTML.yaml
  x-source-files:
  - pkg/authn/handle_register.go
  - pkg/registry/cache.go
  - pkg/registry/local_user_registry.go
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
          - registration_code
          properties:
            registration_code:
              type: string
              description: 'Emailed one-time registration confirmation code: 6–7 ASCII letters/digits.
                Leading/trailing whitespace is trimmed before comparison. This is distinct from the configured
                invitation code.'
              minLength: 1
              writeOnly: true
  parameters:
  - name: realm
    in: path
    description: Configured enabled realm.
    required: true
    schema:
      type: string
      minLength: 1
  - name: registration_id
    in: path
    description: 'Opaque registration ID generated by the portal: 64–95 ASCII letters/digits. It must
      identify an existing registration in this realm.'
    required: true
    schema:
      type: string
      minLength: 64
      maxLength: 95
      pattern: ^[A-Za-z0-9]{64,95}$
