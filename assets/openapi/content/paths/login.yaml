get:
  operationId: loginPage
  tags:
  - Authentication Portal
  summary: Open the login page
  description: Browser entry point. Keep Accept as text/html. fresh=1 forces a new login; a refresh cookie
    can otherwise open the session continuation page. A trusted redirect_url is this tab's own destination
    and is kept in its login transaction. Only short destinations also produce a legacy redirect cookie. The rendered form target and OAuth/SAML
    provider, registration and cross-device links carry it; password forms retain fresh=1, and the continuation page returns to it after a refresh, removing
    the shared cookie only when it holds the same destination. Except on a fresh login, the page script
    polls whoami with probe=login while visible and then leaves for that destination, or the portal. A
    signed-in GET with a trusted redirect_url, without fresh=1 and with a stored portal session matching
    the exact validated access token receives
    303 to that destination without the shared cookie; any other signed-in GET redirects to the portal,
    which consumes the cookie only when no explicit flow destination was supplied. Empty or rejected redirect_url values explicitly select the portal.
    Filesystem themes can preserve GET navigation, including submit-button method overrides,
    when all of a form's submission targets are supported portal navigation routes.
    Forms mixing those targets with external or provider-protocol actions require explicit theme handling;
    the renderer does not add shared destination fields that those unrelated actions would also receive.
    When it supplies bound fields, conflicting reserved names on existing controls are removed,
    including controls associated from outside the form. Malformed forms with ambiguous field ownership
    require correction before relying on automatic GET adaptation. Methods and submitter types use
    HTML ASCII-only keyword matching and its invalid-value defaults.
  security: []
  responses:
    '200':
      $ref: ../components/responses/HTML.yaml
    '302':
      $ref: ../components/responses/Redirect.yaml
    '303':
      $ref: ../components/responses/Redirect.yaml
  x-source-files:
  - pkg/authn/handle_http_login.go
  - pkg/authn/handle_http_session.go
  - pkg/authn/inject_redirect_url.go
  - pkg/authn/ui/login_navigation.go
  - pkg/authn/ui/login_navigation_forms.go
  parameters:
  - name: fresh
    in: query
    description: Force fresh login.
    required: false
    schema:
      type: string
      enum:
      - '1'
  - $ref: ../components/parameters/LoginReturnURL.yaml
post:
  operationId: login
  tags:
  - Authentication Portal
  summary: Authenticate with a challenge or API key
  description: 'Start or continue JSON authentication. Send Accept: application/json (or format=json)
    and Content-Type: application/json. The first request contains username and realm; post each returned
    challenge with the latest sandbox secret. Access-only success returns a bearer token but does not
    establish the stored browser session required by profile operations.

    Disabled or expired local passwords remain required by the default login policy and cannot authenticate.
    Their unavailability does not turn password-plus-MFA into MFA-only login. A stored or configured explicit
    passwordless policy can select another registered factor. Automatically provisioned external identities
    with no local password history have no default local password requirement.


    Refresh requires an enabled participating local realm. The default browser transport delivers credentials
    in HttpOnly cookies. Native clients explicitly send refresh_transport: body at EVERY checkpoint, require
    body transport enabled, and send no Cookie, Origin or Sec-Fetch headers. API-key login is access-only.
    An invalid pre-existing access token can fail authorization before login. Responses disable caching.
    When an external access signer is selected, the portal verifies the staged signature and exact
    approved claims before publishing access, refresh or session credentials. A signing failure publishes
    none of those credentials. For access-only login, a positive access-cookie Max-Age is capped by the
    approved token expiry; session cookies and shorter configured lifetimes retain their behavior.
    Browser form login is also available at this path and returns redirects/HTML instead of the JSON challenge
    protocol. A browser form posted to /login?redirect_url=... keeps that trusted destination with its sandbox
    and is returned there after the last checkpoint, ahead of the shared redirect cookie; fresh=1 is kept for
    a return to the login page. A browser form POST carrying fresh=1 starts its own interactive checkpoint
    even when another tab has authenticated since the form was opened; it does not skip the password or MFA.
    Without refresh tokens or OIDC, a browser that is already signed in with a
    stored portal session and posts the form with a trusted redirect_url and without fresh=1 receives 303
    to that destination instead of a new login. Sandbox creation/policy errors can render HTML even when JSON was requested. Check response
    Content-Type before decoding. MFA selection uses a TOTP code directly or the literal webauthn, followed
    by its signed assertion; see LoginWebAuthnOptions.


    Each admitted browser sandbox receives a separate host-only HttpOnly cookie named
    <configured sandbox cookie name>_<sandbox_id>, scoped to the portal mount with SameSite=Lax and
    Max-Age=300 seconds. It is Secure unless legacy insecure cookie mode is configured. The legacy base
    sandbox cookie is also issued for compatible clients. Retain the independent cookies: two submitted
    tabs can complete in either order without replacing another flow proof or destination. JSON clients
    continue carrying the returned sandbox_id and latest sandbox_secret in request bodies; they do not
    use the browser proof cookies.


    New browser starts return HTML 429 when the request already carries 16 distinct canonical sandbox
    proof-cookie names. This visible-cookie limit is not an atomic per-user quota. The portal sandbox
    cache independently defaults to 10000 live entries across browser, JSON and connected-account starts;
    exhaustion returns 503, HTML for browser login and PortalError JSON for JSON login. Refusal neither
    issues a new sandbox proof nor evicts a live flow. Completion or expiry releases server capacity;
    retained browser proof cookies expire after five minutes. Configured credential retry limits can
    independently return JSON 429.


    LDAP verifies the directory password before resolving or automatically creating the attached local
    identity. Its token id is the local account ID. Registered MFA and explicit challenge policies on a
    connected local account apply after the directory password; JSON clients keep their directory realm
    and username while submitting the next returned challenge. Email equality never connects accounts.


    JSON routing is selected by the exact Accept value application/json or format=json. Once selected,
    this login decoder does not enforce Content-Type; clients should still send application/json. Unknown
    fields fail, but case aliases and repeated fields follow Go string decoding. Null optional strings
    retain their zero/default value; empty unused fields are allowed. The 1024-byte bound applies to the
    decoder reader, not a promise that all trailing body bytes are read. A second JSON value or trailing
    garbage after a complete first object is not examined. Refresh transport checks still apply independently.

    An uncertain managed refresh-store commit returns 503 and withholds staged access and refresh
    credentials, including when uncertainty is combined with an identity denial or cancellation. The
    submitted exchange must not be retried automatically. Reconcile unavailable storage and obtain
    fresh authentication; a session lookup cannot resolve an ambiguous rotation.'
  security: []
  responses:
    '200':
      description: Next checkpoint or authenticated result.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LoginResult.yaml
        text/html:
          schema:
            type: string
            description: Browser form validation errors can render a page with HTTP 200.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Do not store credentials or protocol responses.
    '303':
      $ref: ../components/responses/Redirect.yaml
    '302':
      $ref: ../components/responses/Redirect.yaml
    '400':
      description: JSON protocol/admission error, or HTML from sandbox creation/policy failure. Inspect
        Content-Type before parsing the body.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PortalError.yaml
        text/html:
          schema:
            type: string
    '401':
      $ref: ../components/responses/PortalError.yaml
    '403':
      description: Portal denial, enabled OP origin rejection, or cross-device browser origin rejection.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: ../components/schemas/PortalError.yaml
            - $ref: ../components/schemas/OAuthError.yaml
        text/plain:
          schema:
            type: string
    '429':
      description: Browser sandbox admission refused because 16 canonical proof-cookie names are already
        visible, or a JSON credential retry limit was reached. Existing admitted flows remain usable.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PortalError.yaml
        text/html:
          schema:
            type: string
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
    '500':
      description: JSON protocol/admission error, or HTML from sandbox creation/policy failure. Inspect
        Content-Type before parsing the body.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PortalError.yaml
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
    '503':
      description: The shared portal sandbox cache cannot admit another live login, or another required
        authentication service is unavailable. Sandbox admission returns JSON for JSON login and HTML
        for browser form login, without evicting a live flow or issuing its replacement proof.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PortalError.yaml
        text/html:
          schema:
            type: string
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
  x-source-files:
  - pkg/authn/handle_json_login.go
  - pkg/apiauth/auth_request.go
  - pkg/authn/handle_json_api_key_login.go
  - pkg/authn/respond_http.go
  - pkg/authn/handle_http_login.go
  - pkg/authn/inject_redirect_url.go
  - pkg/authn/browser_sandbox.go
  - pkg/authn/cookie/sandbox_transaction.go
  - pkg/authn/cache/sandbox.go
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yaml
        examples:
          start:
            value:
              username: alice
              realm: local
          native:
            value:
              username: alice
              realm: local
              refresh_transport: body
          password:
            value:
              username: alice
              realm: local
              sandbox_id: returned-id
              sandbox_secret: latest-returned-secret
              challenge_kind: password
              challenge_response: example-password
        x-maxDecodedBytes: 1024
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
          - username
          - realm
          properties:
            username:
              type: string
              description: Login handle/email for the selected identity store.
              minLength: 1
            realm:
              type: string
              description: Login realm selecting the enabled identity store.
              minLength: 1
  parameters:
  - $ref: ../components/parameters/LoginReturnURL.yaml
  - name: fresh
    in: query
    description: 'Browser form only: force an independent interactive login even if another tab has signed
      in since this form was opened. The server still requires its selected password/MFA checkpoints.'
    required: false
    schema:
      type: string
      enum:
      - '1'
  - name: format
    in: query
    description: Use json to select the JSON protocol.
    required: false
    schema:
      type: string
      enum:
      - json
