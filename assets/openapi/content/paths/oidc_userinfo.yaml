get:
  operationId: oidcUserInfoGet
  tags:
  - OpenID Connect
  summary: Read OIDC user claims (GET)
  description: 'Requires an enabled portal OIDC provider and the exact configured issuer origin/mount.
    OIDC access/refresh credentials and signing keys are separate from portal JWTs and portal refresh
    tokens. All responses are no-store.


    Use the opaque access_token from /oidc/token. No query string, portal tokens or cookie authentication.
    POST may instead send access_token in a form; combining that field with Authorization fails. Current
    identity and grant validity are rechecked. Invalid credentials return 401 with WWW-Authenticate: Bearer
    error="invalid_token".


    Exactly one Authorization header is accepted. The Bearer scheme is case-insensitive; token text must
    immediately follow one ASCII space with no embedded spaces, tabs or line breaks. Multiple/malformed
    headers yield invalid_token. A present form access_token conflicts with any Authorization header,
    including an empty one. Header-only POST can omit both body and Content-Type; otherwise POST requires
    a form (MIME parameters allowed), bounded to 16384 bytes with duplicate fields rejected. A bare trailing
    ? also fails. Unknown form fields are ignored. No openid scope is required on a narrowed grant: sub
    is still returned, and granted scope/requested-claim projection controls other fields. Requested claims
    retained in the authorization transaction may still be disclosed after scope narrowing; dropping a
    scope is not a way to erase an explicit claims request.'
  security:
  - OIDCAccessToken: []
  responses:
    '200':
      description: Granted current identity claims.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OIDCUserInfo.yaml
      headers:
        Cache-Control:
          $ref: ../components/headers/NoStore.yaml
        Pragma:
          $ref: ../components/headers/NoCache.yaml
        X-Content-Type-Options:
          $ref: ../components/headers/NoSniff.yaml
        Referrer-Policy:
          $ref: ../components/headers/OIDCNoReferrer.yaml
        X-Frame-Options:
          $ref: ../components/headers/FrameDeny.yaml
        Content-Security-Policy:
          $ref: ../components/headers/OIDCResponseCSP.yaml
    '400':
      $ref: ../components/responses/OIDCInvalidRequest.yaml
    '401':
      description: Missing, expired, revoked or invalid OP bearer access token.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            additionalProperties: false
            properties:
              error:
                type: string
                const: invalid_token
                description: Protocol failure code; no error_description or token fields are emitted.
      headers:
        Cache-Control:
          $ref: ../components/headers/NoStore.yaml
        WWW-Authenticate:
          description: Authentication challenge emitted for this failure.
          schema:
            type: string
            const: Bearer error="invalid_token"
        Pragma:
          $ref: ../components/headers/NoCache.yaml
        X-Content-Type-Options:
          $ref: ../components/headers/NoSniff.yaml
        Referrer-Policy:
          $ref: ../components/headers/OIDCNoReferrer.yaml
        X-Frame-Options:
          $ref: ../components/headers/FrameDeny.yaml
        Content-Security-Policy:
          $ref: ../components/headers/OIDCResponseCSP.yaml
    '405':
      $ref: ../components/responses/OIDCGetPostOnly.yaml
    '503':
      $ref: ../components/responses/OIDCUnavailable.yaml
  x-source-files:
  - pkg/oidc/token.go
  - pkg/oidc/http.go
