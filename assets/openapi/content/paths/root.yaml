get:
  operationId: portalRoot
  tags:
  - Authentication Portal
  summary: Enter the authentication portal
  description: The mounted portal root redirects to its login page. A trusted redirect_url is recorded
    in a legacy redirect cookie only when at most 2048 bytes, and kept in the login page URL, so each browser tab returns to its
    own destination. Empty, untrusted, non-HTTP(S) or oversized values become an explicit empty redirect_url selecting the portal; they cannot fall back to a shared cookie.
  security: []
  parameters:
  - $ref: ../components/parameters/LoginReturnURL.yaml
  responses:
    '302':
      $ref: ../components/responses/Redirect.yaml
  x-source-files:
  - pkg/authn/respond_http.go
  - pkg/authn/inject_redirect_url.go
