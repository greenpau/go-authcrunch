description: Provider state is unavailable or capacity has been reached.
content:
  application/json:
    schema:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
          - temporarily_unavailable
          description: Protocol failure code; no error_description or token fields are emitted.
headers:
  Cache-Control:
    $ref: ../headers/NoStore.yaml
  Pragma:
    $ref: ../headers/NoCache.yaml
  X-Content-Type-Options:
    $ref: ../headers/NoSniff.yaml
  Referrer-Policy:
    $ref: ../headers/OIDCNoReferrer.yaml
  X-Frame-Options:
    $ref: ../headers/FrameDeny.yaml
  Content-Security-Policy:
    $ref: ../headers/OIDCResponseCSP.yaml
