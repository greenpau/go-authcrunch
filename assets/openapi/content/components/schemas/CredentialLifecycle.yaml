type: object
description: Stored credential lifecycle. Omitted boolean flags mean false. Read flags together with times;
  the zero timestamp does not indicate an actual expiry or disable event.
properties:
  created_at:
    type: string
    description: Creation time. RFC 3339 date-time, with fractional seconds when present. An unset Go
      time serializes as 0001-01-01T00:00:00Z, not null.
    format: date-time
  expired_at:
    type: string
    description: Time the record was marked expired. RFC 3339 date-time, with fractional seconds when
      present. An unset Go time serializes as 0001-01-01T00:00:00Z, not null.
    format: date-time
  disabled_at:
    type: string
    description: Time the record was disabled. RFC 3339 date-time, with fractional seconds when present.
      An unset Go time serializes as 0001-01-01T00:00:00Z, not null.
    format: date-time
  expired:
    type: boolean
    description: Whether marked expired; omission means false.
  disabled:
    type: boolean
    description: Whether disabled; omission means false.
x-source-files:
- pkg/identity/api_key.go
- pkg/identity/public_key.go
- pkg/identity/mfa_token.go
- pkg/identity/password.go
