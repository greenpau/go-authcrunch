type: object
required:
- kind
- content
- title
- description
properties:
  kind:
    type: string
    const: add_user_gpg_key
    description: Profile action discriminator; selects this payload and response behavior.
  content:
    type: string
    description: ASCII-armored PGP PUBLIC KEY BLOCK with exact five-hyphen BEGIN/END delimiters after
      surrounding Unicode whitespace is trimmed. The first armor block must yield exactly one decoded
      entity with a signing-capable primary key and at least one self-signed identity. Accepted primary
      algorithms are signing-capable RSA (IDs 1/3), DSA (17) or ECDSA (19). Encryption-only RSA and ECDH
      primaries fail in the entity reader; EdDSA/Ed25519 fails the application algorithm check. Multiple
      successfully decoded entities fail, but the reader can skip unsupported or malformed entities.
      Later appended armor blocks are not inspected for metadata. Private-key armor labels and binary
      input fail; a public armor label does not enforce public-only packets. Secret-key packets under
      that label can be accepted and retained. Submit exported public material only. Identity self-signatures
      establish key/identity binding, not trust in a person or authority to sign portal tokens.
    minLength: 1
  title:
    type: string
    description: Key display title. Nonempty ASCII letters/digits/underscore, @, dot, whitespace or parentheses;
      OpenPGP also permits < > , - + :. The supplied title is preserved; generated identity/algorithm/creation
      metadata can be appended to the stored description.
    pattern: ^[A-Za-z0-9_@.\t\n\f\r ()<>,+:\-]+$
    minLength: 1
  description:
    type: string
    description: Required field; may be empty. Otherwise 3–255 ASCII letters/digits, underscore, whitespace,
      hyphen, comma or dot. The handler does not trim this value.
    pattern: ^(?:[A-Za-z0-9_\t\n\f\r , .\-]{3,255})?$
    maxLength: 255
  labels:
    type: array
    items:
      type: string
    description: Optional arbitrary string labels stored with this credential. Omission means no labels;
      null and non-string members fail.
  tags:
    type: array
    items:
      type: object
      properties:
        key:
          type: string
          description: Tag name; an arbitrary string.
        value:
          type: string
          description: Tag value; an arbitrary string.
      required:
      - key
      - value
    description: Optional credential tags. Each object must contain string key and value; empty strings
      are allowed. Omission means no tags; null fails.
description: An armored OpenPGP public entity; private/binary armor is rejected. Save the key; entry is
  Created. Duplicate uploads fail with 400. Duplicate detection compares either fingerprint within the
  same parsed key type, including empty MD5 fingerprints. Consequently a different OpenPGP key of the
  same algorithm is also rejected while that algorithm already has a record; disabled records still participate.
  Test/parse success alone does not guarantee that add will succeed.
additionalProperties: true
