description: Stored password verifier returned to administrators by operation=info. It is not the plaintext/generated
  password.
x-source-files:
- pkg/identity/password.go
- pkg/identity/password_argon2.go
- pkg/identity/password_hash_config.go
type: object
properties:
  created_at:
    $ref: CredentialLifecycle.yaml#/properties/created_at
  expired_at:
    $ref: CredentialLifecycle.yaml#/properties/expired_at
  disabled_at:
    $ref: CredentialLifecycle.yaml#/properties/disabled_at
  expired:
    $ref: CredentialLifecycle.yaml#/properties/expired
  disabled:
    $ref: CredentialLifecycle.yaml#/properties/disabled
  purpose:
    type: string
    description: Password purpose, normally auth.
  algorithm:
    type: string
    description: 'Stored verifier algorithm: bcrypt or argon2. The argon2 label means Argon2id v19. Older
      records can omit the field, which selects bcrypt.'
    enum:
    - bcrypt
    - argon2
  hash:
    description: Confidential encoded verifier. It is not the plaintext or the prefixed configuration
      import envelope. Interpret its parameters with the stored algorithm.
    oneOf:
    - $ref: BcryptHash.yaml
    - $ref: Argon2Hash.yaml
  cost:
    type: integer
    description: Bcrypt logarithmic work factor, not a duration or iteration count. Imports allow 4–31;
      new configured generation allows 8–31. Argon2 records omit this field and encode memory/passes/lanes
      in hash.
    minimum: 4
    maximum: 31
if:
  properties:
    algorithm:
      const: argon2
  required:
  - algorithm
then:
  properties:
    hash:
      $ref: Argon2Hash.yaml
    cost:
      not: {}
      description: Omitted for Argon2; parameters are embedded in hash.
else:
  properties:
    hash:
      $ref: BcryptHash.yaml
