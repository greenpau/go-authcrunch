type: object
required:
- realm
- operation
- user
properties:
  realm:
    type: string
    description: Exact enabled identity-store realm. Unknown realms currently return JSON null; they do
      not create a new store.
    minLength: 1
  operation:
    type: string
    const: add
    description: Administrative account action selecting this payload.
  user:
    type: object
    required:
    - username
    - email
    - name
    - roles
    properties:
      username:
        type: string
        description: Local account username is preserved exactly, including whitespace and case; uniqueness
          is case-insensitive. Local creation enforces the configured UTF-8 byte-length policy (default
          3–50), not the registration form handle pattern.
        minLength: 1
      email:
        $ref: LocalAccountEmail.yaml
      name:
        type: string
        description: Nonempty display-name input; Unicode whitespace is trimmed by the backend. Whitespace-only
          input creates no name record. Exactly two comma/space-separated components are parsed as Last,
          First / First Last; other forms are stored as an alias. See IdentityName for the returned structure.
        minLength: 1
      roles:
        type: array
        items:
          $ref: LocalRoleInput.yaml
        minItems: 1
        description: At least one role string is required. LocalRoleInput describes successful local validation.
          The decoder ignores non-string array members, but clients should send only strings. Duplicate
          normalized roles are ignored, preserving first occurrence order.
    description: Account selector and operation inputs. username and email must identify the same local
      account for existing-account actions. No supplied password is used; the local store generates a
      new plaintext password and returns it only on success.
x-source-files:
- pkg/authn/handle_api_crud_user.go
- pkg/ids/local/store.go
- pkg/identity/database.go
- pkg/identity/role.go
- pkg/identity/user.go
