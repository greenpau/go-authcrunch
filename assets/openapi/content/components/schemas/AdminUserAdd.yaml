type: object
required:
- realm
- operation
- user
properties:
  realm:
    type: string
    description: Exact enabled identity-store realm. Unknown realms return HTTP 404; they do not create a new store.
    minLength: 1
  operation:
    type: string
    const: add
    description: Administrative account action selecting this payload.
  user:
    type: object
    required:
    - username
    - email
    - name
    - roles
    properties:
      username:
        type: string
        description: SQLite canonicalizes username/email to lowercase, requires a 3–64-byte ASCII handle beginning with a letter/digit, and rejects nobody. Local account username is preserved exactly, including whitespace and case; uniqueness
          is case-insensitive. Local creation enforces the configured UTF-8 byte-length policy (default
          3–50), not the registration form handle pattern.
        minLength: 1
      email:
        $ref: LocalAccountEmail.yaml
      name:
        type: string
        description: Nonempty display-name input. SQLite preserves a nonempty, trimmed UTF-8 alias up to 256 bytes with no control characters; the following parsing rules apply to local records. Unicode whitespace is trimmed by the local backend. Whitespace-only
          input creates no name record. Exactly two comma/space-separated components are parsed as Last,
          First / First Last; other forms are stored as an alias. See IdentityName for the returned structure.
        minLength: 1
      roles:
        type: array
        items:
          $ref: LocalRoleInput.yaml
        minItems: 1
        description: SQLite requires 1–32 roles, each nonempty trimmed UTF-8 up to 128 bytes without controls, preserving case and slash spelling. The complete stored SQLite roles array, including JSON escaping, must fit within 8192 bytes; additions validate the merged result before any mutation. At least one role string is required. LocalRoleInput describes successful local validation.
          The decoder ignores non-string array members, but clients should send only strings. Duplicate
          normalized roles are ignored, preserving first occurrence order.
    description: Account selector and operation inputs. username and email must identify the same local
      account for existing-account actions. No supplied password is used; the selected store generates a
      new plaintext password and returns it only on success.
