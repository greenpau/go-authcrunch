type: string
maxLength: 256
pattern: ^\$argon2id\$v=19\$m=[1-9][0-9]{0,5},t=(?:[1-9]|10),p=(?:[1-9]|1[0-6])\$(?:(?:[A-Za-z0-9+/]{4}){3,21}|(?:[A-Za-z0-9+/]{4}){3,21}[A-Za-z0-9+/][AQgw]|(?:[A-Za-z0-9+/]{4}){2,20}[A-Za-z0-9+/]{2}[AEIMQUYcgkosw048])\$(?:(?:[A-Za-z0-9+/]{4}){6,21}|(?:[A-Za-z0-9+/]{4}){5,21}[A-Za-z0-9+/][AQgw]|(?:[A-Za-z0-9+/]{4}){5,20}[A-Za-z0-9+/]{2}[AEIMQUYcgkosw048])$
description: 'Argon2id v19 PHC verifier: $argon2id$v=19$m=<KiB>,t=<passes>,p=<lanes>$<salt>$<tag>. The
  stored algorithm field is argon2, not argon2id. Parameter order is exactly m,t,p; signs, leading zeros,
  omitted/duplicate/extra parameters and other Argon2 versions/variants fail. Memory is at least 8 KiB
  per lane and at most 262144 KiB; passes are 1–10 and lanes 1–16. Memory multiplied by passes must not
  exceed 1048576 KiB-passes. Those cross-parameter memory bounds require parser validation beyond this
  syntax pattern. Salt is 8–64 decoded bytes and tag 16–64, both canonical unpadded standard Base64, not
  base64url. Generation defaults to 65536 KiB, 3 passes, 4 lanes, a 16-byte salt and 32-byte tag; imports
  retain their own parameters. The whole encoded value is at most 256 ASCII bytes and is confidential.'
