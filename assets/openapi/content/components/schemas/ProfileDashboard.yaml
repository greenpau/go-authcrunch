type: object
description: entry for fetch_user_dashboard_data.
properties:
  metadata:
    $ref: UserMetadata.yaml
  roles:
    type: array
    items:
      type: string
      description: Effective role name.
    description: Effective roles from the presented portal token; these can differ from stored account
      roles after transforms.
  asset_count:
    type: object
    description: Counts for supported credential collections only. Missing counts mean unsupported, not zero. SQLite currently returns an empty object; consult capabilities before offering credential controls.
    properties:
      api_key:
        type: integer
        description: Enabled API-key records; the backend excludes disabled keys even when IncludeAll
          is requested.
        minimum: 0
      ssh_key:
        type: integer
        description: SSH-key records including disabled records.
        minimum: 0
      gpg_key:
        type: integer
        description: GPG-key records including disabled records.
        minimum: 0
      mfa_2fa:
        type: integer
        description: MFA records including disabled records.
        minimum: 0
  capabilities:
    $ref: StoreCapabilities.yaml
    description: Present only when the backend declares capability metadata. Older identity-bound stores retain their existing collection queries without a fabricated declaration.
  connected_accounts:
    type: array
    items: {}
    description: Reserved field; the local backend returns an empty array. SQLite omits it; this placeholder never establishes connection support.
    maxItems: 0
required:
- metadata
- roles
- asset_count
x-source-files:
- pkg/authn/api_fetch_user_dashboard_data.go
- pkg/identity/database.go
