type: object
required:
- kind
- old_password
- new_password
properties:
  kind:
    type: string
    const: update_user_password
    description: Profile action discriminator; selects this payload and response behavior.
  old_password:
    type: string
    writeOnly: true
    description: Current plaintext password. The local profile handler trims surrounding whitespace; SQLite preserves exact plaintext bytes. A mismatch fails without changing the account.
    minLength: 1
  new_password:
    type: string
    writeOnly: true
    description: 'Replacement plaintext password; only the local handler trims it. SQLite requires exact nonblank UTF-8, 12–72 bytes. bcrypt: and argon2: serialized
      imports are rejected. The local database enforces its configured byte-length policy (default 8–128
      bytes), and the active hashing algorithm’s limits (bcrypt accepts at most 72 bytes). Read realm
      policy; these configurable limits are not universal schema bounds.'
    minLength: 1
    not:
      pattern: "^[\\t\\n\\v\\f\\r \N   - \L\P  　]*(?:bcrypt:|argon2:)"
description: Verify the old password and replace it. Successful credential mutations invalidate existing
  login evidence; perform a fresh login. A malformed or non-default-cost stored SQLite bcrypt verifier
  is a storage fault (HTTP 503 with code storage_unavailable), not an incorrect old password. Rejection
  changes neither the verifier nor the credential generation.
additionalProperties: true
x-source-files:
- pkg/authn/api_update_user_password.go
- pkg/identity/identity_request.go
- pkg/identity/database.go
- pkg/identity/password.go
- plugins/identity-stores/sqlite/profile.go
