type: object
required:
- kind
- old_password
- new_password
properties:
  kind:
    type: string
    const: update_user_password
    description: Profile action discriminator; selects this payload and response behavior.
  old_password:
    type: string
    writeOnly: true
    description: Current plaintext password. This profile handler trims surrounding whitespace before
      verification; a mismatch fails without changing the account.
    minLength: 1
  new_password:
    type: string
    writeOnly: true
    description: 'Replacement plaintext password, trimmed before validation. bcrypt: and argon2: serialized
      imports are rejected. The local database enforces its configured byte-length policy (default 8–128
      bytes), and the active hashing algorithm’s limits (bcrypt accepts at most 72 bytes). Read realm
      policy; these configurable limits are not universal schema bounds.'
    minLength: 1
    not:
      pattern: "^[\\t\\n\\v\\f\\r \N   - \L\P  　]*(?:bcrypt:|argon2:)"
description: Verify the old password and replace it. Successful credential mutations invalidate existing
  login evidence; perform a fresh login.
additionalProperties: true
x-source-files:
- pkg/authn/api_update_user_password.go
- pkg/identity/identity_request.go
- pkg/identity/database.go
- pkg/identity/password.go
