type: object
required:
- authenticated
- session_id
- access_expires_at
- refresh_expires_at
- session_expires_at
properties:
  authenticated:
    type: boolean
    const: true
    description: Successful authentication/rotation indicator; always true on this response.
  session_id:
    $ref: PortalSessionID.yaml
  access_expires_at:
    $ref: UnixTime.yaml
    description: Access-token expiry deadline. Whole seconds since 1970-01-01T00:00:00Z (UTC), excluding
      leap seconds; a Unix timestamp, not milliseconds or an ISO date string.
  refresh_expires_at:
    $ref: UnixTime.yaml
    description: Current refresh idle-expiry deadline; successful rotation advances it, capped by the
      absolute session deadline. Whole seconds since 1970-01-01T00:00:00Z (UTC), excluding leap seconds;
      a Unix timestamp, not milliseconds or an ISO date string.
  session_expires_at:
    $ref: UnixTime.yaml
    description: Absolute session-expiry deadline fixed at login; rotation cannot extend it. Whole seconds
      since 1970-01-01T00:00:00Z (UTC), excluding leap seconds; a Unix timestamp, not milliseconds or
      an ISO date string.
additionalProperties: false
description: Credentials arrive only through Secure HttpOnly cookies. JSON carries no access or refresh
  token.
x-source-files:
- pkg/authn/handle_api_refresh_token.go
- pkg/authn/token_refresh/manager.go
