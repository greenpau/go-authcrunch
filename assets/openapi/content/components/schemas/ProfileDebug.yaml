type: object
description: Safe fetch_debug entry identifying the linked library and selected store. No database path, host or credentials are disclosed.
properties:
  version:
    type: string
    description: Linked identity-library version.
  database:
    type: object
    description: Configured backend identifiers.
    properties:
      name:
        type: string
        description: Configured store name.
      engine:
        type: string
        description: Authentic store kind, such as local or sqlite.
    required:
    - name
    - engine
required:
- version
- database
