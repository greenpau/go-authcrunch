type: object
required:
- realm
- operation
- user
properties:
  realm:
    type: string
    description: Exact enabled identity-store realm. Unknown realms return HTTP 404; they do not create a new store.
    minLength: 1
  operation:
    type: string
    const: overwrite_roles
    description: Administrative account action selecting this payload.
  user:
    type: object
    required:
    - username
    - roles
    properties:
      username:
        type: string
        description: Existing account username. SQLite requires its 3–64-byte canonical ASCII handle; lookup is case-insensitive but does not trim whitespace. For local stores it is also case-insensitive,
          and rejects fewer than two UTF-8 bytes. Must select the same account as email when one is required.
        minLength: 1
      email:
        type: string
        description: Existing account email selector. SQLite requires both username and email; the following alias rules apply to local records. Case-insensitive lookup without whitespace
          trimming; fewer than six UTF-8 bytes fail even if the address passed creation syntax. Any indexed
          address may select the account, but username and email must resolve to the same account.
          Omit or send an empty string only for an automatically provisioned account with no local
          email aliases. Provider display email is never a local selector. Other accounts still require
          their matching local email. Null and non-string email values return HTTP 400.
      roles:
        type: array
        items:
          $ref: LocalRoleInput.yaml
        minItems: 1
        description: 'SQLite validates the entire resulting 1–32-role list atomically; each role is nonempty, trimmed UTF-8 up to 128 bytes without controls. An idempotent add_roles retry leaves the credential generation unchanged. The complete stored SQLite roles array, including JSON escaping, must fit within 8192 bytes; additions validate the merged result before any mutation. At least one role string is required. LocalRoleInput describes successful local
          validation. The decoder ignores non-string array members, but clients should send only strings.
          Duplicate normalized roles are ignored, not rejected. add_roles preserves existing roles; overwrite_roles
          replaces them. Validate every role before mutation: a later invalid role can leave earlier in-memory
          changes even when status=failure.'
    description: Account selector and operation inputs. username and any required local email must identify the
      same account; automatically provisioned accounts without local email aliases use username alone.
