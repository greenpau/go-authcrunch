type: object
required:
- realm
- operation
- user
properties:
  realm:
    type: string
    description: Exact enabled identity-store realm. Unknown realms currently return JSON null; they do
      not create a new store.
    minLength: 1
  operation:
    type: string
    const: add_roles
    description: Administrative account action selecting this payload.
  user:
    type: object
    required:
    - username
    - roles
    properties:
      username:
        type: string
        description: Existing local account username. Lookup is case-insensitive but does not trim whitespace,
          and rejects fewer than two UTF-8 bytes. Must select the same account as email when one is required.
        minLength: 1
      email:
        type: string
        description: Existing local account email selector. Case-insensitive lookup without whitespace
          trimming; fewer than six UTF-8 bytes fail even if the address passed creation syntax. Any indexed
          address may select the account, but username and email must resolve to the same account.
          Omit or send an empty string only for an automatically provisioned account with no local
          email aliases. Provider display email is never a local selector. Other accounts still require
          their matching local email. Null and non-string email values return HTTP 400.
      roles:
        type: array
        items:
          $ref: LocalRoleInput.yaml
        minItems: 1
        description: 'At least one role string is required. LocalRoleInput describes successful local
          validation. The decoder ignores non-string array members, but clients should send only strings.
          Duplicate normalized roles are ignored, not rejected. add_roles preserves existing roles; overwrite_roles
          replaces them. Validate every role before mutation: a later invalid role can leave earlier in-memory
          changes even when status=failure.'
    description: Account selector and operation inputs. username and any required local email must identify the
      same account; automatically provisioned accounts without local email aliases use username alone.
x-source-files:
- pkg/authn/handle_api_crud_user.go
- pkg/ids/local/store.go
- pkg/identity/database.go
- pkg/identity/role.go
- pkg/identity/user.go
