type: object
description: Plaintext inner message before encryption. Never submit this JSON directly to /api/system.
properties:
  kind:
    type: string
    description: API-key authentication request.
    const: api_key_auth_request
  realm:
    type: string
    description: Configured identity realm.
    minLength: 1
  address:
    type: string
    description: Nonempty caller-supplied source address copied into the identity addr claim; the message
      validator does not require a parsed IP address.
    minLength: 1
  api_key:
    type: string
    description: Raw API key; not its database hash.
    minLength: 1
    writeOnly: true
required:
- kind
- realm
- address
- api_key
x-source-files:
- pkg/system/api_key_auth_message.go
